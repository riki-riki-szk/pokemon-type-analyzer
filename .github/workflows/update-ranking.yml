name: Update Champions ranking

on:
  schedule:
    # 毎日 21:00 UTC (= 06:00 JST)
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ranking JSON
        run: python scripts/build_ranking.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/champions_ranking.json scripts/names_cache.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update Champions usage ranking ($(date -u +%Y-%m-%d))"
          git push
