name: Update Champions ranking

on:
  schedule:
    # データ元(championsbattledata.com)はその日の分を 19〜22時 JST 頃に公開するので、
    # 23:00 JST に取り込み、保険として 06:00 JST にもう一度実行する
    # (差分がなければコミットしない)
    - cron: "0 14 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ranking JSON
        run: python scripts/build_ranking.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/champions_ranking.json scripts/names_cache.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          DATA_DATE=$(python -c "import json; d=json.load(open('data/champions_ranking.json', encoding='utf-8')); print(d.get('dataDate') or '')")
          git commit -m "Update Champions usage ranking (data: ${DATA_DATE}, run: $(TZ=Asia/Tokyo date +%Y-%m-%d))"
          git push
